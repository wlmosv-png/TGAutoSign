plugins {
    id("com.android.application")
}

android {
    namespace "io.github.wlmosv_png.tgautosign"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.wlmosv_png.tgautosign"
        minSdk 26
        targetSdk 36
        versionCode 102
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            // 本地签名配置：请替换为你自己的 keystore，或注释掉整个 signingConfigs/release 以使用 debug 签名
            def ksPath = System.getenv("TGAS_KEYSTORE") ?: "keystore/wlmosv-release.keystore"
            storeFile file(ksPath)
            storePassword System.getenv("TGAS_KEYSTORE_PASS") ?: "wlmosv@2026"
            keyAlias System.getenv("TGAS_KEY_ALIAS") ?: "wlmosv"
            keyPassword System.getenv("TGAS_KEY_PASS") ?: "wlmosv@2026"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    // API 102: legacy de.robv.android.xposed API is prohibited
    compileOnly("io.github.libxposed:api:102.0.0")

    // v2 UI（目标管理 / 日志 / 设置 / Widget）
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.core:core:1.13.1")
}
