plugins {
    id("com.android.application")
}

android {
    namespace "io.github.wlmosv_png.tgautosign"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.wlmosv_png.tgautosign"
        minSdk 26
        targetSdk 36
        versionCode 103
        versionName "1.2.1"
    }

    signingConfigs {
        release {
            // 只从环境变量读取签名信息，仓库里不留任何口令。
            // 必须沿用签发 v1.1.0/v1.2.0 的同一把 key，否则老用户只能卸载重装。
            def ks = System.getenv("TGAS_KEYSTORE")
            def ksp = System.getenv("TGAS_KEYSTORE_PASS")
            if (ks && ksp) {
                storeFile file(ks)
                storePassword ksp
                keyAlias System.getenv("TGAS_KEY_ALIAS") ?: "wlmosv"
                keyPassword System.getenv("TGAS_KEY_PASS") ?: ksp
            } else {
                logger.warn("TGAutoSign: 未设置 TGAS_KEYSTORE / TGAS_KEYSTORE_PASS，assembleRelease 产物未签名，需自行 apksigner")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    // API 102: legacy de.robv.android.xposed API is prohibited
    compileOnly("io.github.libxposed:api:102.0.0")

    // v2 UI（目标管理 / 日志 / 设置 / Widget）
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.core:core:1.13.1")
}
