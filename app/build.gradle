plugins {
    id("com.android.application")
}

android {
    namespace "io.github.wlmosv_png.tgautosign"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.wlmosv_png.tgautosign"
        minSdk 26
        targetSdk 36
        versionCode 200
        versionName "2.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    // API 102: legacy de.robv.android.xposed API is prohibited
    compileOnly("io.github.libxposed:api:102.0.0")

    // v2 UI（目标管理 / 日志 / 设置 / Widget）
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.core:core:1.13.1")
}
