name: Android CI
on:
  push:    { branches: [ "master" ] }
  pull_request: { branches: [ "master" ] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: gradle }
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:assembleDebug :app:compileReleaseJavaWithJavac
      - uses: actions/upload-artifact@v4
        with: { name: TGAutoSign-debug-ci, path: app/build/outputs/apk/debug/*.apk, if-no-files-found: warn }
